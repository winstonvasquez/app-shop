<app-page-header
    title="Empleados"
    subtitle="Gestión del personal de la empresa"
    [breadcrumbs]="breadcrumbs">
    <div actions>
        <app-button icon="plus" label="Nuevo Empleado" variant="primary" (click)="openCreateModal()" />
    </div>
</app-page-header>

@if (error()) {
    <app-alert type="error" [message]="error()!" />
}

<!-- Tabla (server-side: search + estado + paginación 20/pág) -->
<app-data-table
    [data]="employees()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [searchable]="true"
    searchPlaceholder="Buscar por código, nombre o documento..."
    [filters]="tableFilters"
    [dateRangeFilters]="dateRangeFilters"
    [exportable]="true"
    exportFileName="empleados"
    [exportConfig]="exportConfig"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (searchChange)="onSearchTerm($event)"
    (filterChange)="onFilterChangeEvent($event)"
    (dateRangeChange)="onDateRangeChange($event)"
    (pageChange)="onPaginationChange($event)" />

<!-- ── Drawer: Crear / Editar Empleado ────────────────────────────────── -->
<app-drawer
    [isOpen]="showModal()"
    [title]="editMode() ? 'Editar Empleado' : 'Nuevo Empleado'"
    size="lg"
    [hasFooter]="true"
    (closed)="closeModal()">

    <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">

        @if (submitError()) {
            <app-alert type="error" [message]="submitError()!" />
        }

        <app-admin-form-section title="Datos Personales" [columns]="2">
            <app-form-field
                label="Código Empleado"
                [control]="getControl('codigoEmpleado')"
                placeholder="Ej: E001"
                [required]="true" />

            <app-form-field
                label="DNI / Documento"
                [control]="getControl('documentoIdentidad')"
                placeholder="Ej: 12345678"
                [required]="true" />

            <app-form-field
                label="Nombres"
                [control]="getControl('nombres')"
                placeholder="Nombres del empleado"
                [required]="true" />

            <app-form-field
                label="Apellidos"
                [control]="getControl('apellidos')"
                placeholder="Apellidos del empleado"
                [required]="true" />

            <div class="form-group-2col-span">
                <app-date-input
                    label="Fecha de Ingreso"
                    [required]="true"
                    formControlName="fechaIngreso" />
            </div>
        </app-admin-form-section>

        <app-admin-form-section title="Información Laboral" [columns]="2">
            <app-form-field
                label="Cargo"
                [control]="getControl('cargo')"
                placeholder="Ej: Contador" />

            <app-form-field
                label="Área"
                [control]="getControl('area')"
                placeholder="Ej: Contabilidad" />

            <div>
                <label class="input-label">Estado</label>
                <app-catalog-select tabla="ESTADO_EMPLEADO" formControlName="estado"></app-catalog-select>
            </div>

            <div>
                <label class="input-label">Departamento</label>
                <app-server-search-select [dataSource]="departmentSource"
                                          formControlName="departmentId"
                                          placeholder="Buscar departamento…" />
            </div>

            <div>
                <label class="input-label">Puesto</label>
                <app-server-search-select [dataSource]="positionSource"
                                          formControlName="positionId"
                                          placeholder="Buscar puesto…" />
            </div>

            <div>
                <label class="input-label">Supervisor</label>
                <app-server-search-select [dataSource]="supervisorSource"
                                          formControlName="supervisorId"
                                          placeholder="Buscar supervisor…" />
            </div>
        </app-admin-form-section>

        <app-admin-form-section title="Contacto" [columns]="2">
            <app-form-field
                label="Email"
                [control]="getControl('email')"
                type="email"
                placeholder="correo@empresa.com" />

            <app-form-field
                label="Teléfono"
                [control]="getControl('telefono')"
                type="tel"
                placeholder="Ej: 987654321" />
        </app-admin-form-section>

    </form>

    <!-- Footer del Drawer -->
    <div slot="footer" class="form-actions">
        <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeModal()" />
        <!-- btn-migration: SKIP — label dinámico con ternario (submitting/editMode) -->
        <button class="btn btn-primary" type="button"
                [disabled]="submitting()"
                (click)="onSubmit()">
            {{ submitting() ? 'Guardando...' : (editMode() ? 'Actualizar' : 'Crear Empleado') }}
        </button>
    </div>

</app-drawer>
