<app-page-header
    title="Puestos"
    subtitle="Cargos, requisitos y rangos salariales"
    [breadcrumbs]="breadcrumbs">
    <div actions>
        <app-button icon="plus" label="Nuevo Puesto" variant="primary" (click)="openCreateModal()" />
    </div>
</app-page-header>

@if (error()) {
    <app-alert type="error" [message]="error()!" />
}

<!-- Tabla (server-side: search + departamento + estado + paginación 20/pág) -->
<app-data-table
    [data]="positions()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [searchable]="true"
    searchPlaceholder="Buscar por código o nombre..."
    [filters]="departamentoFilters"
    [exportable]="true"
    exportFileName="puestos"
    [exportConfig]="exportConfig"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (searchChange)="onSearchTerm($event)"
    (filterChange)="onFilterChangeEvent($event)"
    (filtersClear)="onFiltersClear()"
    (pageChange)="onPaginationChange($event)" />

<!-- Drawer: Crear / Editar Puesto -->
<app-drawer
    [isOpen]="showModal()"
    [title]="editMode() ? 'Editar Puesto' : 'Nuevo Puesto'"
    size="md"
    [hasFooter]="true"
    (closed)="closeModal()">

    <form [formGroup]="positionForm" (ngSubmit)="onSubmit()">

        @if (submitError()) {
            <app-alert type="error" [message]="submitError()!" />
        }

        <div class="grid grid-cols-2 gap-4">
            <app-form-field
                label="Código"
                [control]="getControl('codigo')"
                placeholder="Ej: GER-GEN"
                [required]="true" />

            <app-form-field
                label="Nombre"
                [control]="getControl('nombre')"
                placeholder="Ej: Gerente General"
                [required]="true" />
        </div>

        <div style="margin-top: var(--space-md)">
            <label class="input-label">Departamento <span style="color:var(--color-error)">*</span></label>
            <app-server-search-select [dataSource]="departmentSource"
                                      formControlName="departmentId"
                                      placeholder="Buscar departamento…" />
        </div>

        <div style="margin-top: var(--space-md)">
            <app-form-field
                label="Descripción"
                [control]="getControl('descripcion')"
                placeholder="Descripción del puesto" />
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4">
            <app-form-field
                label="Nivel"
                [control]="getControl('nivel')"
                placeholder="Ej: Senior, Junior" />

            <div></div>

            <app-form-field
                label="Salario Mínimo (S/)"
                [control]="getControl('salarioMinimo')"
                type="number"
                placeholder="0.00" />

            <app-form-field
                label="Salario Máximo (S/)"
                [control]="getControl('salarioMaximo')"
                type="number"
                placeholder="0.00" />
        </div>

        <div style="margin-top: var(--space-md)">
            <app-form-field
                label="Requisitos"
                [control]="getControl('requisitos')"
                placeholder="Requisitos del puesto" />
        </div>

    </form>

    <div slot="footer" class="flex justify-end gap-2">
        <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeModal()" />
        <!-- btn-migration: SKIP — label dinámico con ternario (submitting/editMode) -->
        <button class="btn btn-primary" type="button"
                [disabled]="submitting()"
                (click)="onSubmit()">
            {{ submitting() ? 'Guardando...' : (editMode() ? 'Actualizar' : 'Crear Puesto') }}
        </button>
    </div>

</app-drawer>
