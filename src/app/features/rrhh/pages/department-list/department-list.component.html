<app-page-header
    title="Departamentos"
    subtitle="Estructura organizacional de la empresa"
    [breadcrumbs]="breadcrumbs">
    <div actions>
        <app-button label="Nuevo Departamento" icon="plus" variant="primary" (click)="openCreateModal()" />
    </div>
</app-page-header>

@if (error()) {
    <app-alert type="error" [message]="error()!" />
}

<!-- Tabla (server-side: search + activo + jefe + departamento padre + rango fecha creación + paginación 20/pág) -->
<app-data-table
    [data]="departments()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [searchable]="true"
    searchPlaceholder="Buscar por código o nombre..."
    [filters]="estadoFilters"
    [dateRangeFilters]="dateRangeFilters"
    [exportable]="true"
    exportFileName="departamentos"
    [exportConfig]="exportConfig"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (searchChange)="onSearchTerm($event)"
    (filterChange)="onFilterChangeEvent($event)"
    (dateRangeChange)="onDateRangeChange($event)"
    (filtersClear)="onFiltersClear()"
    (pageChange)="onPaginationChange($event)" />

<!-- Drawer: Crear / Editar Departamento -->
<app-drawer
    [isOpen]="showModal()"
    [title]="editMode() ? 'Editar Departamento' : 'Nuevo Departamento'"
    size="md"
    [hasFooter]="true"
    (closed)="closeModal()">

    <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">

        @if (submitError()) {
            <app-alert type="error" [message]="submitError()!" />
        }

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <app-form-field
                label="Código"
                [control]="getControl('codigo')"
                placeholder="Ej: ADMIN"
                [required]="true" />

            <app-form-field
                label="Nombre"
                [control]="getControl('nombre')"
                placeholder="Ej: Administración"
                [required]="true" />
        </div>

        <div style="margin-top: var(--space-md)">
            <app-form-field
                label="Descripción"
                [control]="getControl('descripcion')"
                placeholder="Descripción del departamento" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
            <div>
                <label class="input-label">Departamento Padre</label>
                <app-server-search-select [dataSource]="parentSource"
                                          formControlName="parentId"
                                          placeholder="Buscar departamento…" />
            </div>

            <div>
                <label class="input-label">Jefe / Gerente</label>
                <app-server-search-select [dataSource]="employeeSource"
                                          formControlName="managerId"
                                          placeholder="Buscar empleado por nombre o código…" />
            </div>
        </div>

    </form>

    <div slot="footer" class="flex justify-end gap-2">
        <app-button label="Cancelar" icon="x" variant="secondary" type="button" (click)="closeModal()" />
        <!-- btn-migration: SKIP — label condicional multi-línea (submitting ? 'Guardando...' : editMode ? 'Actualizar' : 'Crear Departamento') -->
        <button class="btn btn-primary" type="button"
                [disabled]="submitting()"
                (click)="onSubmit()">
            {{ submitting() ? 'Guardando...' : (editMode() ? 'Actualizar' : 'Crear Departamento') }}
        </button>
    </div>

</app-drawer>
