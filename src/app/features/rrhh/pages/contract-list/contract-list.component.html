<app-page-header
    title="Contratos"
    subtitle="Gestión de contratos laborales"
    [breadcrumbs]="breadcrumbs">
    <div actions>
        <app-button icon="plus" label="Nuevo Contrato" variant="primary" (click)="openCreateModal()" />
    </div>
</app-page-header>

@if (error()) {
    <app-alert type="error" [message]="error()!" />
}

@if (expiringCount() > 0) {
    <app-alert type="warning"
        [message]="expiringCount() + ' contrato(s) por vencer en los próximos 30 días'" />
}

<!-- Tabla -->
<app-data-table
    [data]="pagedData()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [searchable]="true"
    searchPlaceholder="Buscar por empleado..."
    [filters]="contratoFilters"
    [exportable]="true"
    exportFileName="contratos"
    [hidePagination]="true"
    (searchChange)="onSearchTerm($event)"
    (filterChange)="onFilterChangeEvent($event)" />

<!-- Paginación -->
@if (totalElements() > 0) {
    <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalElements]="totalElements()"
        [pageSize]="pageSize()"
        (pageChange)="onPaginationChange($event)" />
}

<!-- Drawer: Crear / Editar Contrato -->
<app-drawer
    [isOpen]="showModal()"
    [title]="editMode() ? 'Editar Contrato' : 'Nuevo Contrato'"
    size="lg"
    [hasFooter]="true"
    (closed)="closeModal()">

    <form [formGroup]="contractForm" (ngSubmit)="onSubmit()">

        @if (submitError()) {
            <app-alert type="error" [message]="submitError()!" />
        }

        <!-- Empleado -->
        <div style="margin-bottom: var(--space-md)">
            <label class="input-label">Empleado *</label>
            <select class="form-input" formControlName="employeeId">
                <option [ngValue]="null">— Seleccionar empleado —</option>
                @for (emp of employees(); track emp.id) {
                    <option [ngValue]="emp.id">{{ emp.nombres }} {{ emp.apellidos }} ({{ emp.codigoEmpleado }})</option>
                }
            </select>
        </div>

        <app-admin-form-section title="Tipo y Jornada" [columns]="2">
            <div>
                <label class="input-label">Tipo de Contrato *</label>
                <select class="form-input" formControlName="tipoContrato">
                    <option [ngValue]="null">— Seleccionar —</option>
                    @for (type of contractTypes; track type.value) {
                        <option [value]="type.value">{{ type.label }}</option>
                    }
                </select>
            </div>

            <div>
                <label class="input-label">Jornada Laboral *</label>
                <select class="form-input" formControlName="jornadaLaboral">
                    <option [ngValue]="null">— Seleccionar —</option>
                    @for (wd of workingDays; track wd.value) {
                        <option [value]="wd.value">{{ wd.label }}</option>
                    }
                </select>
            </div>
        </app-admin-form-section>

        <app-admin-form-section title="Vigencia" [columns]="2">
            <app-form-field
                label="Fecha Inicio"
                type="date"
                [control]="getControl('fechaInicio')"
                [required]="true" />

            <app-form-field
                label="Fecha Fin"
                type="date"
                [control]="getControl('fechaFin')" />
        </app-admin-form-section>

        <app-admin-form-section title="Remuneración" [columns]="3">
            <app-form-field
                label="Salario Base"
                type="number"
                [control]="getControl('salarioBase')"
                placeholder="0.00"
                [required]="true" />

            <div>
                <label class="input-label">Moneda</label>
                <select class="form-input" formControlName="moneda">
                    <option value="PEN">S/ Soles</option>
                    <option value="USD">$ Dólares</option>
                </select>
            </div>

            <app-form-field
                label="Horas Semanales"
                type="number"
                [control]="getControl('horasSemanales')"
                placeholder="48"
                [required]="true" />
        </app-admin-form-section>

        <app-admin-form-section title="Adicional" [columns]="2">
            <app-form-field
                label="Periodo Prueba (meses)"
                type="number"
                [control]="getControl('periodoPruebaMeses')"
                placeholder="3" />

            <app-form-field
                label="URL Documento"
                [control]="getControl('documentoContratoUrl')"
                placeholder="https://..." />
        </app-admin-form-section>

    </form>

    <div slot="footer" class="form-actions">
        <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeModal()" />
        <app-button icon="save" [label]="editMode() ? 'Actualizar' : 'Crear Contrato'" variant="primary" type="button" [loading]="submitting()" (click)="onSubmit()" />
    </div>

</app-drawer>

<!-- Drawer: Finalizar Contrato -->
<app-drawer
    [isOpen]="showTerminateModal()"
    title="Finalizar Contrato"
    size="sm"
    [hasFooter]="true"
    (closed)="closeTerminateModal()">

    <p style="color: var(--color-text-muted); margin-bottom: var(--space-md)">
        ¿Está seguro de finalizar este contrato? Ingrese el motivo de finalización:
    </p>

    <app-form-field
        label="Motivo de Finalización"
        [control]="terminateMotivo"
        placeholder="Ej: Renuncia voluntaria, término de contrato..."
        [required]="true" />

    <div slot="footer" class="form-actions">
        <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeTerminateModal()" />
        <app-button icon="x-circle" [label]="submitting() ? 'Procesando...' : 'Finalizar Contrato'" variant="danger" type="button" [loading]="submitting()" (click)="onTerminate()" />
    </div>

</app-drawer>
