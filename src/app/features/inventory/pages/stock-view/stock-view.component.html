<div class="page-container">

  <app-page-header
    title="Stock"
    subtitle="Consulta el nivel de stock por almacén"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }

  <!-- Tabla: filtros server-side (almacén, estado de stock, rango de fecha) + paginación real -->
  <app-data-table
    [data]="stock()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [filters]="filters"
    [dateRangeFilters]="dateRangeFilters"
    [exportable]="true"
    exportFileName="stock"
    [exportConfig]="exportConfig"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (filterChange)="onFilterChangeEvent($event)"
    (dateRangeChange)="onDateRangeChange($event)"
    (filtersClear)="onFiltersClear()"
    (pageChange)="onPageChange($event)">
  </app-data-table>

</div>

<!-- Drawer: editar umbrales de stock (mín./máx./punto de reorden) -->
<app-drawer
  [isOpen]="showThresholdsDrawer()"
  title="Editar umbrales de stock"
  size="sm" side="right" [hasFooter]="true"
  (closed)="closeThresholdsDrawer()">

  <form [formGroup]="thresholdsForm" (ngSubmit)="submitThresholds()">
    @if (thresholdsError()) {
      <app-alert type="error" [message]="thresholdsError()!" [dismissible]="true"
                 (dismiss)="thresholdsError.set(null)" />
    }

    <p class="text-sm text-subtle mb-sm">
      Producto #{{ selectedStock()?.productId }} — {{ selectedStock()?.warehouseName }}
    </p>

    <app-form-field label="Stock mínimo" [control]="getThresholdsCtrl('minimumStock')"
      type="number" [required]="true" />
    <app-form-field label="Stock máximo" [control]="getThresholdsCtrl('maximumStock')"
      type="number" [required]="true" />
    <app-form-field label="Punto de reorden" [control]="getThresholdsCtrl('reorderPoint')"
      type="number" [required]="true" />
  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeThresholdsDrawer()" />
    <app-button icon="save" label="Guardar" variant="primary" type="button"
                [loading]="submittingThresholds()" [disabled]="submittingThresholds() || thresholdsForm.invalid"
                (click)="submitThresholds()" />
  </div>
</app-drawer>
