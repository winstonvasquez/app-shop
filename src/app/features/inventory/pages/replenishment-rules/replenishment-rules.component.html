<div class="page-container">

  <app-page-header
    title="Reglas de Reposición Automática"
    subtitle="Cuando el stock cae bajo el punto de reorden, dispara una orden de compra en microshopcompras"
    [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="plus" label="Nueva Regla" variant="primary" (click)="openCreate()" />
    </div>
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }
  @if (info()) {
    <app-alert type="success" [message]="info()!" [dismissible]="true" (dismiss)="info.set(null)" />
  }

  <app-data-table
    [data]="rules()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)">
  </app-data-table>

</div>

<!-- Drawer: crear / editar -->
<app-drawer
  [isOpen]="showDrawer()"
  [title]="editMode() ? 'Editar Regla de Reposición' : 'Nueva Regla de Reposición'"
  size="lg" side="right" [hasFooter]="true"
  (closed)="closeDrawer()">

  <form [formGroup]="form">
    @if (submitError()) {
      <app-alert type="error" [message]="submitError()!" [dismissible]="true"
                 (dismiss)="submitError.set(null)" />
    }

    @if (!editMode()) {
      <div class="col-span-2" style="margin-bottom:0.75rem">
        <label class="input-label">Producto <span class="text-error">*</span></label>
        <app-product-lookup placeholder="Buscar producto por nombre o SKU"
          (selected)="onProductSelected($event)" />
      </div>
    } @else {
      <p class="text-subtle text-xs" style="margin-bottom:0.75rem">
        Producto: <strong>{{ getCtrl('productoNombre').value }}</strong> ({{ getCtrl('sku').value }})
      </p>
    }

    <div class="drawer-form-grid">
      <div class="col-span-2">
        <label class="input-label">Almacén (opcional — vacío aplica a todos)</label>
        <app-server-search-select [dataSource]="almacenSource" formControlName="almacenId"
          placeholder="Buscar almacén…" />
      </div>

      <app-form-field label="SKU" [control]="getCtrl('sku')"
        type="text" placeholder="SKU-001" [required]="true" />
      <app-form-field label="Nombre del producto" [control]="getCtrl('productoNombre')"
        type="text" placeholder="Auto-completado desde el buscador" />

      <app-form-field label="Punto de Reorden" [control]="getCtrl('reorderPoint')"
        type="number" placeholder="0" [required]="true" />
      <app-form-field label="Cantidad a Reponer" [control]="getCtrl('reorderQuantity')"
        type="number" placeholder="1" [required]="true" />

      <app-form-field label="Proveedor preferido" [control]="getCtrl('preferredSupplierName')"
        type="text" placeholder="Nombre del proveedor" />
      <app-form-field label="Costo unitario máximo" [control]="getCtrl('maxUnitCost')"
        type="number" placeholder="0.00" />

      <div class="col-span-2">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="toggle-input" formControlName="autoCreatePo" />
          <span class="input-label">Crear OC automáticamente al dispararse la regla</span>
        </label>
        @if (autoCreatePoWarning()) {
          <app-alert type="warning"
            message="Al activarlo, cuando el stock caiga bajo el punto de reorden se generará una orden de compra REAL en microshopcompras sin intervención manual." />
        }
      </div>
    </div>
  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeDrawer()" />
    <app-button icon="save" [label]="editMode() ? 'Actualizar' : 'Crear Regla'" variant="primary"
                type="button" [loading]="submitting()" [disabled]="submitting() || form.invalid"
                (click)="onSubmit()" />
  </div>
</app-drawer>
