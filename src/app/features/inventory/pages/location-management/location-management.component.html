<div class="page-container">

  <app-page-header
    title="Ubicaciones"
    subtitle="Gestiona la ubicación física de productos dentro de cada almacén"
    [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="plus" label="Nueva Ubicación" variant="primary"
        [disabled]="!selectedWarehouseId()" (click)="openCreate()" />
    </div>
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }

  @if (!selectedWarehouseId()) {
    <p class="text-sm text-subtle mb-sm">Selecciona un almacén en el filtro para ver sus ubicaciones.</p>
  }

  <app-data-table
    [data]="locations()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    [filters]="almacenFilters"
    [exportConfig]="exportConfig"
    (filterChange)="onFilterChangeEvent($event)"
    (pageChange)="onPageChange($event)">
  </app-data-table>

</div>

<!-- Drawer -->
<app-drawer
  [isOpen]="showDrawer()"
  [title]="editMode() ? 'Editar Ubicación' : 'Nueva Ubicación'"
  size="lg" side="right" [hasFooter]="true"
  (closed)="closeDrawer()">

  <form [formGroup]="form">
    @if (submitError()) {
      <app-alert type="error" [message]="submitError()!" [dismissible]="true"
                 (dismiss)="submitError.set(null)" />
    }

    <div class="drawer-form-grid">
      <div class="col-span-2">
        <label class="input-label">Almacén <span class="text-error">*</span></label>
        <select class="form-input" formControlName="warehouseId">
          <option [value]="null">Seleccionar...</option>
          @for (w of warehouses(); track w.id) {
            <option [value]="w.id">{{ w.code }} — {{ w.name }}</option>
          }
        </select>
      </div>

      <app-form-field label="Código" [control]="getCtrl('code')"
        type="text" placeholder="UB-001" [required]="true" />
      <app-form-field label="Nombre" [control]="getCtrl('name')"
        type="text" placeholder="Zona A - Rack 1" />
      <app-form-field label="Pasillo" [control]="getCtrl('aisle')" type="text" placeholder="A" />
      <app-form-field label="Estante" [control]="getCtrl('rack')"  type="text" placeholder="R1" />
      <app-form-field label="Nivel"   [control]="getCtrl('shelf')" type="text" placeholder="N2" />
      <app-form-field label="Posición / Bin" [control]="getCtrl('bin')" type="text" placeholder="B03" />

      <div>
        <label class="input-label">Tipo Ubicación</label>
        <app-catalog-select tabla="TIPO_UBICACION" formControlName="locationType"
          placeholder="General"></app-catalog-select>
      </div>
      <app-form-field label="Capacidad (unid.)" [control]="getCtrl('capacity')"
        type="number" placeholder="0" />

      <div class="col-span-2">
        <app-form-field label="Descripción" [control]="getCtrl('description')"
          type="text" placeholder="Descripción opcional" />
      </div>

      <div class="col-span-2">
        <label class="toggle-row">
          <input type="checkbox" class="toggle-input" formControlName="active" />
          <span class="input-label">Activo</span>
        </label>
      </div>
    </div>
  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" (click)="closeDrawer()" />
    <app-button icon="save"
      [label]="editMode() ? 'Actualizar' : 'Crear Ubicación'"
      variant="primary"
      [loading]="submitting()"
      [disabled]="submitting() || form.invalid"
      (click)="onSubmit()" />
  </div>
</app-drawer>

<!-- Modal: confirmar eliminación -->
<app-modal
  [isOpen]="showConfirmDelete()"
  title="Eliminar ubicación"
  size="sm"
  (closed)="cancelDelete()">
  <p class="text-sm" style="color: var(--color-text-secondary)">
    ¿Estás seguro de que deseas eliminar esta ubicación? Esta acción no se puede deshacer.
  </p>
  <div class="flex justify-end gap-3 pt-4">
    <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="cancelDelete()" />
    <app-button icon="trash-2" label="Eliminar" variant="danger" type="button" (click)="executeDelete()" />
  </div>
</app-modal>
