<div class="page-container">

  <app-page-header
    title="Zonas de Almacén"
    subtitle="Jerarquía WMS: Almacén → Zona → Ubicación (cadena de frío, picking, recepción, despacho)"
    [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="plus" label="Nueva Zona" variant="primary"
        [disabled]="!selectedAlmacenId()" (click)="openCreate()" />
    </div>
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }

  <div style="max-width:420px;margin-bottom:1rem">
    <label class="input-label">Almacén</label>
    <app-server-search-select [dataSource]="almacenSource"
      [ngModel]="selectedAlmacenId()" (ngModelChange)="onAlmacenSelected($event)"
      placeholder="Buscar almacén…" />
  </div>

  @if (!selectedAlmacenId()) {
    <p class="text-subtle text-xs">Elegí un almacén para ver y administrar sus zonas.</p>
  } @else {
    <app-data-table
      [data]="zones()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      [searchable]="true"
      searchPlaceholder="Buscar por código, nombre o descripción..."
      [filters]="filters"
      [dateRangeFilters]="dateRangeFilters"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalElements]="totalElements()"
      [totalPages]="totalPages()"
      (searchChange)="onSearchTerm($event)"
      (filterChange)="onFilterChangeEvent($event)"
      (dateRangeChange)="onDateRangeChange($event)"
      (filtersClear)="onFiltersClear()"
      (pageChange)="onPageChange($event)">
    </app-data-table>
  }

</div>

<!-- Drawer: crear / editar -->
<app-drawer
  [isOpen]="showDrawer()"
  [title]="editMode() ? 'Editar Zona' : 'Nueva Zona'"
  size="lg" side="right" [hasFooter]="true"
  (closed)="closeDrawer()">

  <form [formGroup]="form">
    @if (submitError()) {
      <app-alert type="error" [message]="submitError()!" [dismissible]="true"
                 (dismiss)="submitError.set(null)" />
    }

    <div class="drawer-form-grid">
      <app-form-field label="Código" [control]="getCtrl('codigo')"
        type="text" placeholder="Z-A1" [required]="true" />
      <app-form-field label="Nombre" [control]="getCtrl('nombre')"
        type="text" placeholder="Zona A - Almacenamiento" [required]="true" />

      <div>
        <label class="input-label">Tipo <span class="text-error">*</span></label>
        <app-catalog-select tabla="TIPO_ZONA_ALMACEN" formControlName="tipo"
          placeholder="Elegir tipo…"></app-catalog-select>
      </div>
      <div>
        <label class="input-label">Temperatura</label>
        <app-catalog-select tabla="TEMPERATURA_ZONA" formControlName="temperatura"
          placeholder="Ambiente"></app-catalog-select>
      </div>

      <app-form-field label="Capacidad Máxima" [control]="getCtrl('capacidadMaxima')"
        type="number" placeholder="0" />
      <app-form-field label="Orden de Picking" [control]="getCtrl('ordenPicking')"
        type="number" placeholder="0" />

      <div class="col-span-2">
        <app-form-field label="Descripción" [control]="getCtrl('descripcion')"
          type="text" placeholder="Descripción opcional" />
      </div>
    </div>
  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeDrawer()" />
    <app-button icon="save" [label]="editMode() ? 'Actualizar' : 'Crear Zona'" variant="primary"
                type="button" [loading]="submitting()" [disabled]="submitting() || form.invalid"
                (click)="onSubmit()" />
  </div>
</app-drawer>

<!-- Drawer: ubicaciones dentro de la zona -->
<app-drawer
  [isOpen]="showLocationsDrawer()"
  [title]="'Ubicaciones — Zona ' + (locationsTarget()?.codigo ?? '')"
  size="lg" side="right"
  (closed)="closeLocationsDrawer()">

  @if (locationsError()) {
    <app-alert type="error" [message]="locationsError()!" [dismissible]="true" (dismiss)="locationsError.set(null)" />
  }

  <form [formGroup]="locationForm" class="drawer-form-grid" style="margin-bottom:1rem">
    <app-form-field label="Código" [control]="getLocationCtrl('codigo')" type="text" placeholder="A-01-01" [required]="true" />
    <div>
      <label class="input-label">Tipo</label>
      <app-catalog-select tabla="TIPO_UBICACION_ZONA" formControlName="tipo"></app-catalog-select>
    </div>
    <app-form-field label="Pasillo" [control]="getLocationCtrl('pasillo')" type="text" placeholder="A" />
    <app-form-field label="Estante" [control]="getLocationCtrl('estante')" type="text" placeholder="R1" />
    <app-form-field label="Nivel" [control]="getLocationCtrl('nivel')" type="text" placeholder="N2" />
    <app-form-field label="Posición" [control]="getLocationCtrl('posicion')" type="text" placeholder="B03" />
    <app-form-field label="Capacidad Máxima" [control]="getLocationCtrl('capacidadMaxima')" type="number" placeholder="0" />
    <div class="col-span-2" style="text-align:right">
      <app-button icon="plus" label="Agregar ubicación" variant="primary" type="button"
        [loading]="locationSubmitting()" [disabled]="locationSubmitting() || locationForm.invalid"
        (click)="submitLocation()" />
    </div>
  </form>

  <app-data-table
    [data]="zoneLocations()"
    [columns]="locationColumns"
    [actions]="locationActions"
    [loading]="locationsLoading()">
  </app-data-table>
</app-drawer>

<!-- Modal: confirmar eliminación -->
<app-modal
  [isOpen]="showConfirmDelete()"
  title="Eliminar zona"
  size="sm"
  (closed)="cancelDelete()">
  <p class="text-sm" style="color: var(--color-text-secondary)">
    ¿Estás seguro de que deseas eliminar esta zona? Esta acción no se puede deshacer.
  </p>
  <div class="flex justify-end gap-3 pt-4">
    <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="cancelDelete()" />
    <app-button icon="trash-2" label="Eliminar" variant="danger" type="button" (click)="executeDelete()" />
  </div>
</app-modal>
