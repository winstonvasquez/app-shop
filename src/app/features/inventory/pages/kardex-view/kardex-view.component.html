<div class="page-container">

  <app-page-header
    title="Kardex Valorizado"
    subtitle="Historial de movimientos y valorización por producto"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  <!-- Búsqueda de producto -->
  <div style="max-width:560px;margin-bottom:1rem">
    <app-product-lookup placeholder="Buscar producto por nombre o SKU"
      (selected)="onProductSelected($event)" />
  </div>

  @if (currentProductName()) {
    <div class="text-subtle" style="font-size:0.9rem;margin-bottom:0.5rem">
      Kardex de <strong>{{ currentProductName() }}</strong>
      <span style="font-size:0.75rem">#{{ currentProductId() }}</span>
    </div>
  }

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }

  @if (!currentProductId() && !loading()) {
    <div class="empty-state">
      <p class="empty-state-desc">Buscá un producto por nombre para ver su historial de kardex.</p>
    </div>
  } @else {
    <app-data-table
      [data]="pagedEntries()"
      [columns]="columns"
      [loading]="loading()"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalElements]="totalElements()"
      [totalPages]="totalPages()"
      [exportConfig]="exportConfig"
      (pageChange)="onPageChange($event)">
    </app-data-table>
  }

</div>

<style>
.filter-field { display: flex; flex-direction: column; gap: 4px; }
.filter-action { display: flex; align-items: flex-end; }
</style>
