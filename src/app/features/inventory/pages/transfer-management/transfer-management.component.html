<div class="page-container">

  <app-page-header
    title="Transferencias"
    subtitle="Gestiona el traslado de stock entre almacenes"
    [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="plus" label="Nueva Transferencia" variant="primary" (click)="openCreate()" />
    </div>
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }

  <app-data-table
    [data]="transfers()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    [filters]="estadoFilters"
    [exportConfig]="exportConfig"
    (filterChange)="onFilterChangeEvent($event)"
    (pageChange)="onPageChange($event)">
  </app-data-table>

</div>

<!-- Drawer: Nueva Transferencia -->
<app-drawer
  [isOpen]="showDrawer()"
  title="Nueva Transferencia"
  size="lg" side="right" [hasFooter]="true"
  (closed)="closeDrawer()">

  <form [formGroup]="form">
    @if (submitError()) {
      <app-alert type="error" [message]="submitError()!" [dismissible]="true"
                 (dismiss)="submitError.set(null)" />
    }

    <div class="drawer-form-grid">
      <div>
        <label class="input-label">Almacén Origen <span class="text-error">*</span></label>
        <app-server-search-select [dataSource]="warehouseSource"
                                  formControlName="sourceWarehouseId"
                                  placeholder="Buscar almacén…" />
      </div>

      <div>
        <label class="input-label">Almacén Destino <span class="text-error">*</span></label>
        <app-server-search-select [dataSource]="warehouseSource"
                                  formControlName="destinationWarehouseId"
                                  placeholder="Buscar almacén…" />
      </div>

      <div class="col-span-2">
        <app-date-input label="Fecha Solicitud" formControlName="requestDate" [required]="true" />
      </div>

      <div class="col-span-2">
        <app-form-field label="Notas" [control]="getCtrl('notes')"
          type="text" placeholder="Observaciones opcionales" />
      </div>
    </div>

    <!-- Ítems dinámicos -->
    <div class="items-section">
      <div class="items-header">
        <span class="input-label">Productos a transferir <span class="text-error">*</span></span>
      </div>
      <app-product-lookup placeholder="Buscar producto para agregar a la transferencia"
        (selected)="onAddProductRow($event)" />

      <div formArrayName="details" style="margin-top:0.75rem">
        @for (detail of details.controls; track $index; let i = $index) {
          <div class="item-row" [formGroupName]="i">
            <div style="flex:1;min-width:0">
              <label class="input-label">Producto</label>
              <div class="text-sm" style="padding:0.4rem 0">
                {{ getDetailCtrl(i, 'productName').value || ('Producto #' + getDetailCtrl(i, 'productId').value) }}
              </div>
            </div>
            <app-form-field label="Cantidad" [control]="getDetailCtrl(i, 'requestedQuantity')"
              type="number" placeholder="1" [required]="true" />
            <app-form-field label="Notas" [control]="getDetailCtrl(i, 'notes')"
              type="text" placeholder="Opcional" />
            <app-button [iconOnly]="true" icon="x" variant="danger" size="sm"
              ariaLabel="Eliminar fila" (click)="removeDetail(i)" label="Eliminar" />
          </div>
        } @empty {
          <p class="text-subtle text-xs" style="margin-top:0.5rem">Buscá productos para agregarlos a la transferencia.</p>
        }
      </div>
    </div>
  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" type="button" (click)="closeDrawer()" />
    <app-button icon="save" label="Crear Transferencia" variant="primary" type="button"
                [loading]="submitting()" [disabled]="submitting() || form.invalid || details.length === 0"
                (click)="onSubmit()" />
  </div>
</app-drawer>
