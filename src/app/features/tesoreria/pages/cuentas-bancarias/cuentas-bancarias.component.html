<div class="page-container">

  <app-page-header
    title="Cuentas Bancarias"
    subtitle="Gestión de cuentas bancarias del tenant">
    <div meta class="header-kpis">
      <span class="header-kpi">Saldo PEN <b>S/ {{ saldoTotalPEN() | number:'1.2-2' }} ({{ cuentasPEN() }})</b></span>
      <span class="header-kpi">Saldo USD <b>$ {{ saldoTotalUSD() | number:'1.2-2' }} ({{ cuentasUSD() }})</b></span>
      <span class="header-kpi header-kpi--neutral">Detracciones <b>S/ {{ saldoDetracciones() | number:'1.2-2' }}</b></span>
    </div>
    <div actions>
      <app-button icon="plus" label="Nueva Cuenta" variant="primary" (click)="openCreateDrawer()" />
    </div>
  </app-page-header>

  <!-- Tabla -->
  <app-data-table
    [data]="cuentas()"
    [columns]="columns"
    [actions]="actions"
    [loading]="cargando()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    [exportConfig]="exportConfig"
    (pageChange)="onPageChange($event)">
  </app-data-table>

</div>

<!-- Drawer: Nueva Cuenta Bancaria -->
<app-drawer
  [isOpen]="showCreateDrawer()"
  title="Nueva Cuenta Bancaria"
  size="lg"
  side="right"
  [hasFooter]="true"
  (closed)="showCreateDrawer.set(false)">

  @if (errorMsg()) {
    <div class="bg-[var(--color-error-subtle,color-mix(in_oklch,var(--color-primary)_10%,transparent))] border border-[var(--color-error)] rounded-lg p-[var(--space-sm)] mb-[var(--space-md)] text-[var(--color-error)] text-sm">
      {{ errorMsg() }}
    </div>
  }

  <form [formGroup]="createForm" class="flex flex-col gap-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="input-label">Banco *</label>
        <app-catalog-select tabla="BANCO" formControlName="banco" placeholder="Seleccionar banco..."></app-catalog-select>
      </div>
      <div>
        <label class="input-label">Tipo de Cuenta *</label>
        <app-catalog-select tabla="TIPO_CUENTA_BANCARIA" formControlName="tipoCuenta"></app-catalog-select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <app-form-field
        label="N° Cuenta"
        [control]="getControl(createForm, 'numeroCuenta')"
        type="text"
        placeholder="000-1234567890"
        [required]="true">
      </app-form-field>
      <div>
        <label class="input-label">Moneda *</label>
        <app-catalog-select tabla="MONEDA" formControlName="moneda"></app-catalog-select>
      </div>
    </div>

    <app-form-field
      label="CCI (Código de Cuenta Interbancario)"
      [control]="getControl(createForm, 'cuentaInterbancaria')"
      type="text"
      placeholder="002-194-000123456780-01"
      hint="Código interbancario 20 dígitos">
    </app-form-field>

    <app-form-field
      label="Saldo Inicial (S/)"
      [control]="getControl(createForm, 'saldoInicial')"
      type="number"
      placeholder="0.00">
    </app-form-field>

    <app-form-field
      label="Descripción"
      [control]="getControl(createForm, 'descripcion')"
      type="text"
      placeholder="Descripción opcional"
      hint="Opcional">
    </app-form-field>
  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" [disabled]="guardando()" (click)="showCreateDrawer.set(false)" />
    <app-button icon="save" label="Guardar Cuenta" variant="primary" [loading]="guardando()" [disabled]="guardando() || createForm.invalid" (click)="crearCuenta()" />
  </div>
</app-drawer>

<!-- Drawer: Editar Cuenta Bancaria -->
<app-drawer
  [isOpen]="showEditDrawer()"

  size="lg"
  side="right"

  <form [formGroup]="editForm" class="flex flex-col gap-3">

    </div>

    <div class="grid grid-cols-2 gap-3">
      <app-form-field
        label="N° Cuenta"
        [control]="getControl(editForm, 'numeroCuenta')"
        type="text"
        placeholder="000-1234567890"
        [required]="true">
      </app-form-field>
      <div>
        <label class="input-label">Moneda *</label>
        <app-catalog-select tabla="MONEDA" formControlName="moneda"></app-catalog-select>

    </div>

    <app-form-field
      label="CCI (Código de Cuenta Interbancario)"

    <app-form-field
      label="Saldo Inicial (S/)"

    <app-form-field

  </form>

  <div slot="footer">
    <app-button icon="x" label="Cancelar" variant="secondary" [disabled]="guardando()" (click)="showEditDrawer.set(false)" />
    <app-button icon="save" label="Actualizar" variant="primary" [loading]="guardando()" [disabled]="guardando() || editForm.invalid" (click)="actualizarCuenta()" />
  </div>
</app-drawer>
