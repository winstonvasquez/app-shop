<div class="products-page">
    <!-- Page Header -->
    <app-page-header
        title="Gestión de Productos"
        subtitle="Administra el catálogo de productos de tu tienda"
        [breadcrumbs]="breadcrumbs">
        <div actions>
            <app-button label="Nuevo Producto" icon="plus" variant="primary" (click)="openCreateModal()" />
        </div>
    </app-page-header>

    <!-- Error Message -->
    @if (error()) {
        <app-alert
            type="error"
            [message]="error()!"
            [dismissible]="true"
            (dismiss)="error.set(null)">
        </app-alert>
    }

    <!-- Data Table with all states -->
    <app-data-table
        [data]="products()"
        [columns]="columns"
        [actions]="actions"
        [loading]="loading()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="totalElements()"
        [totalPages]="totalPages()"
        [sortField]="sortField()"
        [sortDirection]="sortDirection()"
        [searchable]="true"
        searchPlaceholder="Buscar productos..."
        [filters]="filters"
        [dateRangeFilters]="dateRangeFilters"
        [exportable]="true"
        exportFileName="productos"
        [exportConfig]="exportConfig"
        (searchChange)="onSearchTerm($event)"
        (filterChange)="onFilterChangeEvent($event)"
        (dateRangeChange)="onDateRangeChange($event)"
        (filtersClear)="onFiltersClear()"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSort($event)">
    </app-data-table>

    <!-- Drawer for Create/Edit Product -->
    <app-drawer
        [isOpen]="showModal()"
        [title]="editMode() ? 'Editar Producto' : 'Nuevo Producto'"
        size="lg"
        side="right"
        [hasFooter]="true"
        (closed)="closeModal()">

        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
            @if (submitError()) {
                <app-alert
                    type="error"
                    [message]="submitError()!"
                    [dismissible]="true"
                    (dismiss)="submitError.set(null)">
                </app-alert>
            }

            <app-form-field
                label="Nombre"
                [control]="getControl('nombre')"
                type="text"
                placeholder="Ej: Laptop HP 15"
                [required]="true">
            </app-form-field>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <textarea
                    id="descripcion"
                    formControlName="descripcion"
                    class="form-input"
                    rows="3"
                    placeholder="Descripción detallada del producto">
                </textarea>
            </div>

            <app-form-field
                label="Precio Base"
                [control]="getControl('precioBase')"
                type="number"
                placeholder="0.00"
                hint="Precio en dólares"
                [required]="true">
            </app-form-field>

            <app-form-field
                label="Marca"
                [control]="getControl('marca')"
                type="text"
                placeholder="Ej: HP, Dell, Samsung">
            </app-form-field>

            <div class="form-group">
                <label>Categorías</label>
                <div class="category-checkbox-list">
                    @for (cat of categorias(); track cat.id) {
                        <label class="category-checkbox-item">
                            <input type="checkbox"
                                [checked]="isCategoriaSelected(cat.id)"
                                (change)="toggleCategoria(cat.id)">
                            {{ cat.nombre }}
                        </label>
                    } @empty {
                        <span class="text-subtle">Sin categorías disponibles</span>
                    }
                </div>
            </div>

            <!-- Imágenes: se guardan como binario en la base de datos -->
            <div class="form-group">
                <label>Imágenes del producto</label>

                @if (editMode() && imagenes().length > 0) {
                    <div class="product-images">
                        @for (img of imagenes(); track img.id) {
                            <figure class="product-image" [class.is-main]="img.esPrincipal">
                                <img [src]="img.url" [alt]="'Imagen ' + img.orden" />
                                <figcaption>
                                    @if (img.esPrincipal) {
                                        <span class="badge badge-success">Principal</span>
                                    }
                                    <button type="button" class="btn-icon btn-icon-delete"
                                            title="Eliminar imagen"
                                            (click)="onEliminarImagen(img)">✕</button>
                                </figcaption>
                            </figure>
                        }
                    </div>
                }

                <app-image-upload
                    [label]="''"
                    (fileSelected)="imagenSeleccionada.set($event)"
                    (cleared)="imagenSeleccionada.set(null)">
                </app-image-upload>

                @if (!editMode()) {
                    <small class="form-hint">La imagen se subirá al crear el producto.</small>
                }
            </div>
        </form>

        <div slot="footer">
            <app-button label="Cancelar" icon="x" variant="secondary" (click)="closeModal()" [disabled]="submitting()" />
            <app-button
                [label]="editMode() ? 'Actualizar Producto' : 'Crear Producto'"
                icon="save"
                variant="primary"
                (click)="onSubmit()"
                [disabled]="submitting() || productForm.invalid"
                [loading]="submitting()" />
        </div>
    </app-drawer>
</div>
