<div class="products-page">
    <!-- Page Header -->
    <app-page-header
        title="Gestión de Productos"
        subtitle="Administra el catálogo de productos de tu tienda"
        [breadcrumbs]="breadcrumbs">
        <div actions>
            <app-button label="Nuevo Producto" icon="plus" variant="primary" (click)="openCreateModal()" />
        </div>
    </app-page-header>

    <!-- Error Message -->
    @if (error()) {
        <app-alert
            type="error"
            [message]="error()!"
            [dismissible]="true"
            (dismiss)="error.set(null)">
        </app-alert>
    }

    <!-- Data Table with all states -->
    <app-data-table
        [data]="products()"
        [columns]="columns"
        [actions]="actions"
        [loading]="loading()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="totalElements()"
        [totalPages]="totalPages()"
        [sortField]="sortField()"
        [sortDirection]="sortDirection()"
        [searchable]="true"
        searchPlaceholder="Buscar productos..."
        [filters]="filters"
        [dateRangeFilters]="dateRangeFilters"
        [exportable]="true"
        exportFileName="productos"
        [exportConfig]="exportConfig"
        (searchChange)="onSearchTerm($event)"
        (filterChange)="onFilterChangeEvent($event)"
        (dateRangeChange)="onDateRangeChange($event)"
        (filtersClear)="onFiltersClear()"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSort($event)">
    </app-data-table>

    <!-- Drawer for Create/Edit Product -->
    <app-drawer
        [isOpen]="showModal()"
        [title]="editMode() ? 'Editar Producto' : 'Nuevo Producto'"
        size="lg"
        side="right"
        [hasFooter]="true"
        (closed)="closeModal()">

        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
            @if (submitError()) {
                <app-alert
                    type="error"
                    [message]="submitError()!"
                    [dismissible]="true"
                    (dismiss)="submitError.set(null)">
                </app-alert>
            }

            <app-form-field
                label="Nombre"
                [control]="getControl('nombre')"
                type="text"
                placeholder="Ej: Laptop HP 15"
                [required]="true">
            </app-form-field>

            <div class="form-group">
                <label>Descripción</label>
                <app-rich-text-editor
                    ariaLabel="Descripción"
                    formControlName="descripcion"
                    [rows]="3"
                    placeholder="Descripción detallada del producto" />
            </div>

            <app-form-field
                label="Precio Base"
                [control]="getControl('precioBase')"
                type="number"
                placeholder="0.00"
                hint="Precio en dólares"
                [required]="true">
            </app-form-field>

            <app-form-field
                label="Marca"
                [control]="getControl('marca')"
                type="text"
                placeholder="Ej: HP, Dell, Samsung">
            </app-form-field>

            <div class="form-group">
                <label>Categorías</label>
                <app-multi-check-select
                    [options]="categoriaOptions()"
                    formControlName="categoriaIds"
                    placeholder="Selecciona categorías…"
                    searchPlaceholder="Buscar categoría…" />
            </div>

            <!-- Imágenes: se guardan como binario en la base de datos -->
            <div class="form-group">
                <label>Imágenes del producto</label>

                <app-image-gallery-manager
                    [images]="imagenes()"
                    [pending]="imagenesPendientes()"
                    [disabled]="submitting() || reordenando()"
                    hint="JPG, PNG o WebP · máximo 500 KB cada una."
                    (filesAdded)="onImagenesElegidas($event)"
                    (pendingRemoved)="onQuitarPendiente($event)"
                    (pendingMainChanged)="onPendientePrincipal($event)"
                    (pendingMoved)="onMoverPendiente($event)"
                    (removed)="onEliminarImagen($event)"
                    (mainChanged)="onMarcarPrincipal($event)"
                    (reordered)="onReordenarImagenes($event)" />

                @if (!editMode() && imagenesPendientes().length > 0) {
                    <small class="form-hint">
                        Las {{ imagenesPendientes().length }} imágenes se subirán al crear el producto.
                    </small>
                }
                @if (imagenesError()) {
                    <app-alert type="error" [message]="imagenesError()!" />
                }
            </div>

        </form>

        <div slot="footer">
            <app-button label="Cancelar" icon="x" variant="secondary" (click)="closeModal()" [disabled]="submitting()" />
            <app-button
                [label]="editMode() ? 'Actualizar Producto' : 'Crear Producto'"
                icon="save"
                variant="primary"
                (click)="onSubmit()"
                [disabled]="submitting() || productForm.invalid"
                [loading]="submitting()" />
        </div>
    </app-drawer>
</div>
