<div class="categories-page">
    <!-- Page Header -->
    <app-page-header
        title="Gestión de Categorías"
        subtitle="Organiza tu catálogo con categorías jerárquicas"
        [breadcrumbs]="breadcrumbs">
        <div actions>
            @if (puedeGestionar) {
                <app-button
                    label="Nueva Categoría"
                    variant="primary"
                    icon="plus"
                    (click)="openCreateModal()">
                </app-button>
            }
        </div>
    </app-page-header>

    <!-- Error Message -->
    @if (error()) {
        <app-alert
            type="error"
            [message]="error()!"
            [dismissible]="true"
            (dismiss)="error.set(null)">
        </app-alert>
    }

    <!-- Data Table -->
    <app-data-table
        [data]="categories()"
        [columns]="columns"
        [actions]="actions"
        [loading]="loading()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="totalElements()"
        [totalPages]="totalPages()"
        [sortField]="sortField()"
        [sortDirection]="sortDirection()"
        [searchable]="true"
        searchPlaceholder="Buscar categorías..."
        [filters]="tableFilters"
        [dateRangeFilters]="dateRangeFilters"
        [exportable]="true"
        exportFileName="categorias"
        [exportConfig]="exportConfig"
        (searchChange)="onSearchTerm($event)"
        (filterChange)="onFilterChangeEvent($event)"
        (dateRangeChange)="onDateRangeChange($event)"
        (filtersClear)="onFiltersClear()"
        (pageChange)="onPageChange($event)"
        (sortChange)="onSort($event)">
    </app-data-table>

    <!-- Drawer for Create/Edit Category -->
    <app-drawer
        [isOpen]="showModal()"
        [title]="editMode() ? 'Editar Categoría' : 'Nueva Categoría'"
        size="lg"
        side="right"
        [hasFooter]="true"
        (closed)="closeModal()">

        <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
            @if (submitError()) {
                <app-alert
                    type="error"
                    [message]="submitError()!"
                    [dismissible]="true"
                    (dismiss)="submitError.set(null)">
                </app-alert>
            }

            <app-form-field
                label="Nombre"
                [control]="getControl('nombre')"
                type="text"
                placeholder="Ej: Electrónica, Ropa, Alimentos"
                [required]="true">
            </app-form-field>

            <div class="form-group">
                <label>Descripción</label>
                <app-rich-text-editor
                    ariaLabel="Descripción"
                    formControlName="descripcion"
                    [rows]="3"
                    placeholder="Descripción de la categoría" />
            </div>

            <!-- La imagen se guarda en la base de datos, no como enlace externo -->
            <div class="form-group">
                <app-image-upload
                    label="Imagen de la categoría"
                    [currentUrl]="getControl('imagenUrl')?.value"
                    (fileSelected)="imagenSeleccionada.set($event)"
                    (cleared)="onQuitarImagen()">
                </app-image-upload>
            </div>

            <div class="form-group">
                <label for="padreId">Categoría padre</label>
                <select id="padreId" formControlName="padreId" class="form-input">
                    <option [ngValue]="null">Ninguna (categoría raíz)</option>
                    @for (c of opcionesPadre(); track c.id) {
                        <option [ngValue]="c.id">{{ c.nombre }}</option>
                    }
                </select>
                <small class="form-hint">Opcional. Para crear una subcategoría, elige la categoría de la que depende.</small>
            </div>

            <div class="form-group">
                <label for="nivel">Nivel Jerárquico <span class="required">*</span></label>
                <app-catalog-select
                    tabla="NIVEL_JERARQUICO_CATEGORIA"
                    formControlName="nivel">
                </app-catalog-select>
                <small class="form-hint">Nivel 0 = Categoría raíz, niveles superiores = subcategorías</small>
            </div>
        </form>

        <div slot="footer">
            <app-button
                label="Cancelar"
                variant="secondary"
                icon="x"
                type="button"
                [disabled]="submitting()"
                (click)="closeModal()">
            </app-button>
            <app-button
                [label]="editMode() ? 'Actualizar Categoría' : 'Crear Categoría'"
                variant="primary"
                icon="save"
                type="button"
                [loading]="submitting()"
                [disabled]="submitting() || categoryForm.invalid"
                (click)="onSubmit()">
            </app-button>
        </div>
    </app-drawer>
</div>
