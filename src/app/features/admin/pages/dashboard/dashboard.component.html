<div class="page-header mb-6">
    <div>
        <h1 class="page-title text-xl font-extrabold text-[var(--color-text-primary)] tracking-tight">{{ 'admin.dashboard.title' | translate }}</h1>
        <p class="page-subtitle text-xs text-[var(--color-text-muted)]">Resumen del periodo. Para el detalle por módulo, ve a Reportes → Dashboard Ejecutivo.</p>
    </div>
</div>

@if (error()) {
    <div class="mb-6 p-md border border-[var(--color-border)] rounded-md text-sm text-subtle" role="alert">{{ error() }}</div>
}

<!-- KPI Cards: datos reales de GET /api/analytics/dashboard -->
<div class="kpi-grid kpi-grid-4 mb-6">
    @for (metric of metrics(); track metric.label) {
        <div class="kpi-card kpi-card-{{ metric.iconColor }} animate-card-in">
            <div class="kpi-top">
                <span class="kpi-label">{{ metric.label }}</span>
                <div class="kpi-icon kpi-icon-{{ metric.iconColor }}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="metric.iconSvg" />
                    </svg>
                </div>
            </div>
            <div class="kpi-value">{{ metric.value }}</div>
            <div class="kpi-trend">{{ metric.detail }}</div>
        </div>
    }
</div>

<app-erp-health-card />
