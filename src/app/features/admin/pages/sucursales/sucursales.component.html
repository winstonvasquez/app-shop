<div class="page-container">
    <!-- Mismo encabezado que el resto del ERP: replicarlo a mano desalineaba el
         título 12px respecto a /admin/products y las demás vistas. -->
    <app-page-header
        title="Sucursales"
        [subtitle]="'Gestión de sucursales de la empresa — ' + totalElements() + ' en total'">
        <div actions>
            @if (!showForm()) {
                <button class="btn btn-primary" (click)="openCreate()">+ Nueva sucursal</button>
            }
        </div>
    </app-page-header>

    @if (error()) {
        <div class="alert alert-error">{{ error() }}</div>
    }

    @if (loading()) {
        <p class="empty">Cargando...</p>
    } @else if (showForm()) {
        <!-- Form drawer inline -->
        <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">
            <h2>{{ editingId() ? 'Editar' : 'Nueva' }} sucursal</h2>

            @if (submitError()) {
                <div class="alert alert-error">{{ submitError() }}</div>
            }

            <div class="form-grid">
                <label>
                    Nombre *
                    <input type="text" formControlName="nombre" placeholder="Ej: Sucursal Miraflores">
                </label>
                <label>
                    Teléfono
                    <input type="tel" formControlName="telefono" placeholder="Ej: 999 888 777">
                </label>
                <label class="full">
                    Dirección
                    <input type="text" formControlName="direccion" placeholder="Calle, número, distrito">
                </label>
                <label>
                    Ubigeo SUNAT
                    <input type="text" formControlName="ubigeo" maxlength="6" placeholder="150122">
                </label>
                <label>
                    Serie Boleta
                    <input type="text" formControlName="serieBoleta" maxlength="4" placeholder="B001">
                    @if (editingId()) {
                        <small class="form-hint">Correlativo SUNAT: no editable tras el primer comprobante</small>
                    }
                </label>
                <label>
                    Serie Factura
                    <input type="text" formControlName="serieFactura" maxlength="4" placeholder="F001">
                    @if (editingId()) {
                        <small class="form-hint">Correlativo SUNAT: no editable tras el primer comprobante</small>
                    }
                </label>
                <!-- Estado: baja lógica reversible (permite reactivar una sucursal desactivada) -->
                <div class="full checkbox-field">
                    <label class="checkbox-label">
                        <input type="checkbox" formControlName="activo">
                        <span>Sucursal activa</span>
                    </label>
                    <small class="form-hint">
                        Al desmarcarla la sucursal queda inactiva; vuelve a marcarla para reactivarla.
                    </small>
                </div>
            </div>

            <div class="actions">
                <button type="button" class="btn btn-secondary" (click)="cancel()">Cancelar</button>
                <button type="submit" class="btn btn-primary" [disabled]="submitting()">
                    {{ submitting() ? 'Guardando...' : (editingId() ? 'Actualizar' : 'Crear') }}
                </button>
            </div>
        </form>
    } @else {
        <!-- Tabla server-side (búsqueda con X + Buscar + filtros + export, paginación real) -->
        <app-data-table
            [data]="sucursales()"
            [columns]="columns"
            [actions]="actions"
            [loading]="loading()"
            [searchable]="true"
            searchPlaceholder="Buscar por nombre, dirección, teléfono o serie..."
            [filters]="filters"
            [dateRangeFilters]="dateRangeFilters"
            [exportable]="true"
            exportFileName="sucursales"
            [exportConfig]="exportConfig"
            [currentPage]="currentPage()"
            [pageSize]="pageSize()"
            [totalElements]="totalElements()"
            [totalPages]="totalPages()"
            (searchChange)="onSearchTerm($event)"
            (filterChange)="onFilterChangeEvent($event)"
            (dateRangeChange)="onDateRangeChange($event)"
            (filtersClear)="onFiltersClear()"
            (pageChange)="onPageChange($event)">
        </app-data-table>
    }
</div>
