<app-page-header
    title="Gestión de Clientes"
    subtitle="Administra los clientes de tu empresa"
    [breadcrumbs]="breadcrumbs">
    <app-button actions label="Nuevo Cliente" variant="primary" icon="plus" (click)="openCreate()" />
</app-page-header>

<div class="page-container">
    <!-- Error -->
    @if (error()) {
        <div class="card" style="border-left: 3px solid var(--color-error)">
            <div class="card-body">
                <p class="text-on">{{ error() }}</p>
            </div>
        </div>
    }

    <!-- Loading -->
    @if (loading()) {
        <div class="loading-container">
            <div class="spinner"></div>
        </div>
    }

    <!-- Barra de acciones en lote -->
    @if (selectedIds().size > 0) {
        <div class="card" style="margin-bottom: 1rem;">
            <div class="card-body" style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;">
                <span class="text-on">{{ selectedIds().size }} seleccionados</span>
                <app-button label="Asignar Segmento" variant="secondary" size="sm" (click)="showBulkSegment.set(!showBulkSegment())" />
                @if (showBulkSegment()) {
                    <select class="form-input" style="width: auto;" (change)="assignSegment(+$any($event.target).value)">
                        <option value="">Seleccionar...</option>
                        <option value="1">VIP</option>
                        <option value="2">Regular</option>
                        <option value="3">Ocasional</option>
                        <option value="4">Mayorista</option>
                    </select>
                }
            </div>
        </div>
    }

    <!-- Tabla estándar (búsqueda con X + Buscar + export en toolbar, selección múltiple, paginación empalmada) -->
    <app-data-table
        [data]="customers()"
        [columns]="columns"
        [actions]="actions"
        [loading]="loading()"
        [selectable]="true"
        [searchable]="true"
        searchPlaceholder="Buscar por nombre, documento o email..."
        [exportable]="true"
        exportFileName="clientes"
        [exportConfig]="exportConfig"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="totalElements()"
        [totalPages]="totalPages()"
        (searchChange)="onSearch($event)"
        (selectionChange)="onSelectionChange($event)"
        (pageChange)="onPageChange($event)">
    </app-data-table>
</div>

<!-- Drawer de formulario -->
<app-customer-form
    [isOpen]="showDrawer()"
    [customer]="editingCustomer()"
    (saved)="onSaved()"
    (cancel)="closeDrawer()">
</app-customer-form>
