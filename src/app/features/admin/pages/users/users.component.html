<div class="page-container">

    <!-- Cabecera -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Gestión de Clientes</h1>
            <p class="page-subtitle">Administra los usuarios y clientes del sistema</p>
        </div>
        <app-button
            label="Nuevo Cliente"
            icon="plus"
            variant="primary"
            (click)="openCreateModal()"
            ariaLabel="Crear nuevo cliente">
        </app-button>
    </div>

    <!-- Alerta de error -->
    @if (error()) {
    <div class="alert alert-error mb-4" role="alert">{{ error() }}</div>
    }

    <app-data-table
        [data]="users()"
        [columns]="columns"
        [actions]="actions"
        [loading]="loading()"
        [searchable]="true"
        searchPlaceholder="Buscar por nombre, email o documento..."
        [filters]="filters"
        [dateRangeFilters]="dateRangeFilters"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="totalElements()"
        [totalPages]="totalPages()"
        [sortField]="sortField()"
        [sortDirection]="sortDirection()"
        (searchChange)="onSearchTerm($event)"
        (filterChange)="onFilterChangeEvent($event)"
        (dateRangeChange)="onDateRangeChange($event)"
        (filtersClear)="onFiltersClear()"
        (pageChange)="onPaginationChange($event)"
        (sortChange)="onSort($event)">
    </app-data-table>

    <!-- Formulario en Drawer -->
    <app-user-form
        [formGroup]="userForm"
        [roles]="roles()"
        [editMode]="editMode()"
        [submitting]="submitting()"
        [submitError]="submitError()"
        [isOpen]="showDrawer()"
        (save)="onSubmit()"
        (cancel)="closeModal()">
    </app-user-form>

</div>
