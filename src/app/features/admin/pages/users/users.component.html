<div class="page-container">

    <!-- Cabecera -->
    <div class="page-header">
        <div>
            <h1 class="page-title">Gestión de Clientes</h1>
            <p class="page-subtitle">Administra los usuarios y clientes del sistema</p>
        </div>
        <app-button
            label="Nuevo Cliente"
            icon="plus"
            variant="primary"
            (click)="openCreateModal()"
            ariaLabel="Crear nuevo cliente">
        </app-button>
    </div>

    <!-- Alerta de error -->
    @if (error()) {
    <div class="alert alert-error mb-4" role="alert">{{ error() }}</div>
    }

    <!-- Barra de filtros (búsqueda por botón Buscar / Enter) -->
    <div class="filters-bar">
        <div class="search-box">
            <svg class="search-box-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input #searchInput type="text" placeholder="Buscar por nombre, email o documento..."
                [value]="searchQuery()"
                (keyup.enter)="onSearch(searchInput.value)" />
        <button type="button" class="search-clear search-clear--auto" aria-label="Limpiar búsqueda"
            (click)="searchInput.value=''; onSearch('')">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
        </div>
        <app-button label="Buscar" icon="search" variant="primary" size="sm"
            (click)="onSearch(searchInput.value)"></app-button>
    </div>

    <!-- Loading -->
    @if (loading()) {
    <div class="loading-container">
        <div class="spinner"></div>
        <p>Cargando clientes…</p>
    </div>
    }

    <!-- Tabla de usuarios -->
    @if (!loading()) {
    <app-user-list
        [users]="users()"
        (edit)="openEditModal($event)"
        (delete)="onDelete($event)">
    </app-user-list>

    <!-- Paginación estándar -->
    <app-pagination
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        [totalElements]="totalElements()"
        [pageSize]="pageSize()"
        (pageChange)="onPaginationChange($event)">
    </app-pagination>
    }

    <!-- Formulario en Drawer -->
    <app-user-form
        [formGroup]="userForm"
        [roles]="roles()"
        [editMode]="editMode()"
        [submitting]="submitting()"
        [submitError]="submitError()"
        [isOpen]="showDrawer()"
        (save)="onSubmit()"
        (cancel)="closeModal()">
    </app-user-form>

</div>
