<div class="page-container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Libro Diario</h1>
            <p class="page-subtitle">PCGE 2020 · Partida doble</p>
        </div>
        <div class="page-actions">
            <app-button
                icon="download"
                variant="secondary"
                label="Exportar PLE"
                [disabled]="lineas().length === 0"
                (click)="exportarPLE()">
            </app-button>
            <app-button
                icon="download"
                variant="secondary"
                label="Exportar CSV"
                [disabled]="lineas().length === 0"
                (click)="exportarCSV()">
            </app-button>
        </div>
    </div>

    <div class="card mb-lg">
        <div class="filters-bar">
            <select class="form-input" [value]="periodoSeleccionado()"
                    (change)="cambiarPeriodo($any($event.target).value)">
                <option value="">— Seleccionar periodo —</option>
                @for (p of periodos(); track p.id) {
                    <option [value]="p.id">{{ p.nombre }} ({{ p.estado }})</option>
                }
            </select>
            <input type="date" class="form-input" style="width:160px"
                   [value]="fechaDesde()" (input)="fechaDesde.set($any($event.target).value)" />
            <input type="date" class="form-input" style="width:160px"
                   [value]="fechaHasta()" (input)="fechaHasta.set($any($event.target).value)" />
            <app-button
                icon="search"
                variant="primary"
                label="Consultar"
                (click)="cargarLibro()">
            </app-button>
        </div>
    </div>

    @if (error()) {
        <div class="card mb-lg">
            <div class="card-body" style="color:var(--color-error);text-align:center">
                {{ error() }}
            </div>
        </div>
    }

    @if (lineas().length > 0) {
        <div class="card mb-lg">
            <div class="card-body">
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-md)">
                    <div>
                        <div class="input-label">Total Debe</div>
                        <div class="font-bold text-xl font-mono">S/ {{ totalDebe().toFixed(2) }}</div>
                    </div>
                    <div>
                        <div class="input-label">Total Haber</div>
                        <div class="font-bold text-xl font-mono">S/ {{ totalHaber().toFixed(2) }}</div>
                    </div>
                    <div>
                        <div class="input-label">Cuadre</div>
                        @if (cuadra()) {
                            <span class="badge badge-success">Cuadra</span>
                        } @else {
                            <span class="badge badge-error">No cuadra</span>
                        }
                    </div>
                </div>
            </div>
        </div>
    }

    <app-data-table
        [data]="lineasPaginadas()"
        [columns]="columns"
        [loading]="cargando()"
        [searchable]="true"
        searchPlaceholder="Buscar por cuenta, descripción o asiento..."
        [exportable]="true"
        exportFileName="libro-diario"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="lineasFiltradas().length"
        [totalPages]="totalPagesLocal()"
        (searchChange)="onSearchTerm($event)"
        (pageChange)="onPageChange($event)">
    </app-data-table>
</div>
