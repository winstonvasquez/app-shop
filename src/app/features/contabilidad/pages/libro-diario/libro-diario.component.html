<div class="page-container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Libro Diario</h1>
            <p class="page-subtitle">PCGE 2020 · Partida doble</p>
            @if (lineas().length > 0) {
                <div class="header-kpis">
                    <span class="header-kpi">Total Debe <b>S/ {{ totalDebe().toFixed(2) }}</b></span>
                    <span class="header-kpi">Total Haber <b>S/ {{ totalHaber().toFixed(2) }}</b></span>
                    @if (cuadra()) {
                        <span class="header-kpi header-kpi--success">Cuadre <b>Cuadra</b></span>
                    } @else {
                        <span class="header-kpi header-kpi--error">Cuadre <b>No cuadra</b></span>
                    }
                </div>
            }
        </div>
        <div class="page-actions">
            <app-button
                icon="download"
                variant="secondary"
                label="Exportar PLE"
                [disabled]="lineas().length === 0"
                (click)="exportarPLE()">
            </app-button>
            <app-button
                icon="download"
                variant="secondary"
                label="Exportar CSV"
                [disabled]="lineas().length === 0"
                (click)="exportarCSV()">
            </app-button>
        </div>
    </div>

    @if (error()) {
        <div class="card mb-lg">
            <div class="card-body" style="color:var(--color-error);text-align:center">
                {{ error() }}
            </div>
        </div>
    }

    <app-data-table
        [data]="lineas()"
        [columns]="columns"
        [loading]="cargando()"
        [searchable]="true"
        searchPlaceholder="Buscar por cuenta, descripción o asiento..."
        [filters]="filters"
        [dateRangeFilters]="dateRangeFilters"
        [exportable]="true"
        exportFileName="libro-diario"
        [exportConfig]="exportConfig"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="totalElements()"
        [totalPages]="totalPages()"
        (searchChange)="onSearchTerm($event)"
        (filterChange)="onFilterChangeEvent($event)"
        (dateRangeChange)="onDateRangeChange($event)"
        (filtersClear)="onFiltersClear()"
        (pageChange)="onPageChange($event)">
    </app-data-table>
</div>
