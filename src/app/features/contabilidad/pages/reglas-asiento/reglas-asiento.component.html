<div class="page-container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Reglas de Asiento Automático</h1>
            <p class="page-subtitle">Configura qué cuentas PCGE se afectan por tipo de transacción</p>
        </div>
        <div class="page-actions">
            <app-button label="Nueva Regla" icon="plus" variant="primary" (click)="abrirNueva()" />
        </div>
    </div>

    @if (error()) {
        <div class="badge badge-error mb-4 block">{{ error() }}</div>
    }

    <app-data-table
        [data]="reglasPaginadas()"
        [columns]="columns"
        [actions]="actions"
        [loading]="cargando()"
        [searchable]="true"
        searchPlaceholder="Buscar por nombre, descripción o tipo..."
        [exportable]="true"
        exportFileName="reglas-asiento"
        [exportConfig]="exportConfig"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="reglasFiltradas().length"
        [totalPages]="totalPagesLocal()"
        (searchChange)="onSearchTerm($event)"
        (pageChange)="onPageChange($event)">
    </app-data-table>
</div>

<!-- ── DRAWER FORMULARIO ──────────────────────────────────────────── -->
<app-drawer
    [isOpen]="mostrarForm()"
    [title]="editandoId() ? 'Editar Regla' : 'Nueva Regla de Asiento'"
    size="lg"
    side="right"
    [hasFooter]="true"
    (closed)="cerrarForm()">

    @if (errorForm()) {
        <div class="badge badge-error mb-4 block">{{ errorForm() }}</div>
    }

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
            <label class="input-label">Tipo de transacción *</label>
            <app-catalog-select tabla="TIPO_TRANSACCION"
                    [ngModel]="tipoTransaccion()" (ngModelChange)="tipoTransaccion.set($event)"></app-catalog-select>
        </div>
        <div>
            <label class="input-label">Nombre *</label>
            <input class="form-input" type="text" placeholder="Ej: Venta gravada con IGV"
                   [ngModel]="nombre()" (ngModelChange)="nombre.set($event)" />
        </div>
        <div class="col-span-2">
            <label class="input-label">Descripción</label>
            <input class="form-input" type="text" placeholder="Descripción opcional"
                   [ngModel]="descripcion()" (ngModelChange)="descripcion.set($event)" />
        </div>
    </div>

    <!-- Líneas de detalle -->
    <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
            <label class="input-label mb-0">Líneas de asiento *</label>
            <app-button label="Línea" icon="plus" variant="secondary" (click)="agregarDetalle()" />
        </div>
        <div class="overflow-x-auto">
            <table class="table text-sm">
                <thead>
                    <tr>
                        <th class="table-header-cell">Cód. PCGE</th>
                        <th class="table-header-cell">Campo origen</th>
                        <th class="table-header-cell">Movimiento</th>
                        <th class="table-header-cell">% Aplicar</th>
                        <th class="table-header-cell w-10"></th>
                    </tr>
                </thead>
                <tbody>
                    @for (d of detalles(); track $index; let i = $index) {
                        <tr class="table-row">
                            <td class="table-cell">
                                <input class="form-input py-1" type="text"
                                       placeholder="Ej: 121101"
                                       [ngModel]="d.codigoCuenta"
                                       (ngModelChange)="actualizarDetalle(i, 'codigoCuenta', $event)" />
                            </td>
                            <td class="table-cell">
                                <app-catalog-select tabla="CAMPO_ORIGEN_REGLA_ASIENTO"
                                        [ngModel]="d.campoOrigen"
                                        (ngModelChange)="actualizarDetalle(i, 'campoOrigen', $event)"></app-catalog-select>
                            </td>
                            <td class="table-cell">
                                <app-catalog-select tabla="TIPO_MOVIMIENTO_CONTABLE"
                                        [ngModel]="d.movimientoTipo"
                                        (ngModelChange)="actualizarDetalle(i, 'movimientoTipo', $event)"></app-catalog-select>
                            </td>
                            <td class="table-cell">
                                <input class="form-input py-1 w-20"
                                       type="number" min="1" max="100"
                                       [ngModel]="d.porcentaje"
                                       (ngModelChange)="actualizarDetalle(i, 'porcentaje', +$event)" />
                            </td>
                            <td class="table-cell">
                                @if (detalles().length > 2) {
                                    <app-button icon="trash-2" [iconOnly]="true" variant="danger"
                                            ariaLabel="Eliminar línea"
                                            (click)="eliminarDetalle(i)" />
                                }
                            </td>
                        </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>

    <ng-container slot="footer">
        <div class="flex gap-3 justify-end">
            <app-button label="Cancelar" icon="x" variant="secondary"
                    [disabled]="guardando()"
                    (click)="cerrarForm()" />
            <app-button [label]="guardando() ? 'Guardando...' : 'Guardar'"
                    icon="save" variant="primary"
                    [loading]="guardando()"
                    [disabled]="guardando() || !nombre()"
                    (click)="guardar()" />
        </div>
    </ng-container>
</app-drawer>
