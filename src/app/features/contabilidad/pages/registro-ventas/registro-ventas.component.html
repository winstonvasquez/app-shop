<div class="page-container">
    <div class="page-header">
        <div>
            <h1 class="page-title">Registro de Ventas</h1>
            <p class="page-subtitle">PLE — Libro 14 · SUNAT</p>
            @if (ventas().length > 0) {
                <div class="header-kpis">
                    <span class="header-kpi header-kpi--neutral">Comprobantes <b>{{ ventas().length }}</b></span>
                    <span class="header-kpi">Base Imponible <b>S/ {{ totalBase().toFixed(2) }}</b></span>
                    <span class="header-kpi">IGV (18%) <b>S/ {{ totalIgv().toFixed(2) }}</b></span>
                    <span class="header-kpi">Total Ventas <b>S/ {{ totalVentas().toFixed(2) }}</b></span>
                </div>
            }
        </div>
        <div class="page-actions">
            <input class="form-input" type="text" maxlength="11" placeholder="RUC (11 dígitos)"
                   style="width:160px"
                   [ngModel]="rucEmpresa()" (ngModelChange)="rucEmpresa.set($event)" />
            <app-button
                [label]="descargandoPLE() ? 'Generando...' : 'Descargar PLE Libro 14'"
                variant="primary"
                icon="download"
                [loading]="descargandoPLE()"
                [disabled]="descargandoPLE() || !periodoSeleccionado() || rucEmpresa().length !== 11"
                (click)="descargarPLE14()">
            </app-button>
            <app-button
                label="Exportar PLE TXT"
                variant="secondary"
                icon="download"
                [disabled]="ventas().length === 0"
                (click)="exportarPLE()">
            </app-button>
            <app-button
                label="Exportar CSV"
                variant="secondary"
                icon="download"
                [disabled]="ventas().length === 0"
                (click)="exportarCSV()">
            </app-button>
        </div>
    </div>

    <div class="filters-bar">
        <select class="form-input"
                [value]="periodoSeleccionado()"
                (change)="cambiarPeriodo($any($event.target).value)">
            <option value="">— Seleccionar periodo —</option>
            @for (p of periodos(); track p.id) {
                <option [value]="p.id">{{ p.nombre }} ({{ p.estado }})</option>
            }
        </select>
        <input type="date" class="form-input" style="width:160px" [value]="fechaDesde()" (input)="fechaDesde.set($any($event.target).value)" />
        <input type="date" class="form-input" style="width:160px" [value]="fechaHasta()" (input)="fechaHasta.set($any($event.target).value)" />
        <app-button label="Buscar" variant="primary" icon="search" (click)="cargar()"></app-button>
    </div>

    @if (error()) {
        <div class="card mb-lg">
            <div class="card-body" style="color:var(--color-error);text-align:center">{{ error() }}</div>
        </div>
    }

    <app-data-table
        [data]="ventasPaginadas()"
        [columns]="columns"
        [loading]="cargando()"
        [searchable]="true"
        searchPlaceholder="Buscar por serie, número, cliente o RUC..."
        [exportable]="true"
        exportFileName="registro-ventas"
        [exportConfig]="exportConfig"
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalElements]="ventasFiltradas().length"
        [totalPages]="totalPagesLocal()"
        (searchChange)="onSearchTerm($event)"
        (pageChange)="onPageChange($event)">
    </app-data-table>
</div>
