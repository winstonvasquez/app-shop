<div class="page-container">
  <app-page-header
    title="Inventario"
    subtitle="Stock de productos por almacén"
    [breadcrumbs]="breadcrumbs">
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" (dismiss)="error.set(null)" [dismissible]="true" />
  }

  <!-- Tabla (server-side: search + almacén desde BD + paginación 20/pág) -->
  <app-data-table
    [data]="items()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [searchable]="true"
    searchPlaceholder="Buscar producto o SKU..."
    [filters]="almacenFilters"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    [exportable]="true"
    exportFileName="inventario-export"
    (searchChange)="onSearchTerm($event)"
    (filterChange)="onFilterChangeEvent($event)"
    (pageChange)="onPaginationChange($event)">
  </app-data-table>
</div>
