<div class="page-container">
  <app-page-header
    title="Packing"
    subtitle="Empaque de órdenes recogidas y habilitación para despacho"
    [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="plus" variant="primary" label="Nueva orden de packing" (click)="openCreate()" />
    </div>
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" (dismiss)="error.set(null)" [dismissible]="true" />
  }
  @if (info()) {
    <app-alert type="success" [message]="info()!" (dismiss)="info.set(null)" [dismissible]="true" />
  }

  <app-data-table
    [data]="orders()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [filters]="filters"
    [exportable]="false"
    [hidePagination]="true"
    (filterChange)="onFilterChange($event)"
    (filtersClear)="onFiltersClear()">
  </app-data-table>
</div>

<app-drawer [isOpen]="showForm()" title="Nueva orden de packing" size="md" side="right"
            [hasFooter]="true" (closed)="closeForm()">
  <form [formGroup]="form">
    <div class="form-field-wrapper">
      <label class="input-label">Orden de picking (PICKED) *</label>
      <select class="form-input" formControlName="pickingOrderId">
        <option value="">-- Seleccione orden de picking --</option>
        @for (p of pickedOrders(); track p.id) {
          <option [value]="p.id">{{ p.id.slice(0, 8) }} · pedido {{ p.orderId.slice(0, 8) }}</option>
        }
      </select>
      @if (form.controls.pickingOrderId.invalid && form.controls.pickingOrderId.touched) {
        <span class="input-error-message">Seleccione una orden de picking</span>
      }
    </div>
    <div class="form-grid">
      <div class="form-field-wrapper">
        <label class="input-label">Tipo de bulto</label>
        <input class="form-input" type="text" formControlName="packageType" placeholder="Caja, sobre, pallet...">
      </div>
      <div class="form-field-wrapper">
        <label class="input-label">Peso (kg)</label>
        <input class="form-input" type="number" min="0" step="0.001" formControlName="weight">
      </div>
      <div class="form-field-wrapper">
        <label class="input-label">Largo (cm)</label>
        <input class="form-input" type="number" min="0" step="0.1" formControlName="length">
      </div>
      <div class="form-field-wrapper">
        <label class="input-label">Ancho (cm)</label>
        <input class="form-input" type="number" min="0" step="0.1" formControlName="width">
      </div>
      <div class="form-field-wrapper">
        <label class="input-label">Alto (cm)</label>
        <input class="form-input" type="number" min="0" step="0.1" formControlName="height">
      </div>
      <div class="form-field-wrapper" style="grid-column:1/-1">
        <label class="input-label">Notas</label>
        <input class="form-input" type="text" formControlName="notes">
      </div>
    </div>
  </form>
  @if (submitError()) {
    <app-alert type="error" [message]="submitError()!" />
  }
  <div slot="footer">
    <app-button icon="x" variant="secondary" label="Cancelar" (click)="closeForm()" />
    <app-button icon="check" variant="primary"
      [label]="submitting() ? 'Creando...' : 'Crear'"
      [disabled]="submitting()" (click)="onSubmit()" />
  </div>
</app-drawer>
