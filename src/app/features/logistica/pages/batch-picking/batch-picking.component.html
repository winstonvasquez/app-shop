<div class="page-container">

  <app-page-header title="Batch Picking" subtitle="Agrupa órdenes de picking en batches para optimizar el recorrido de almacén" [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="refresh-cw" label="Actualizar" variant="secondary" (click)="loadBatches()" />
    </div>
  </app-page-header>

  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }
  @if (successMsg()) {
    <app-alert type="success" [message]="successMsg()!" [dismissible]="true" (dismiss)="successMsg.set(null)" />
  }

  <!-- Formulario generar batch -->
  <div class="card mb-6">
    <div class="card-header">
      <h2 class="card-title">Generar Nuevo Batch</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="batchForm" (ngSubmit)="generateBatch()">
        <div class="drawer-form-grid">
          <app-form-field label="IDs de Órdenes (separados por coma)" [control]="getCtrl('orderIdsInput')"
            type="text" placeholder="ej: ord-001, ord-002, ord-003" [required]="true" />
          <div>
            <label class="input-label">Estrategia</label>
            <app-catalog-select tabla="ESTRATEGIA_PICKING" formControlName="strategy"></app-catalog-select>
          </div>
        </div>
        <div style="margin-top:1rem;text-align:right">
          <app-button
            type="submit"
            variant="primary"
            icon="play"
            [label]="generating() ? 'Generando...' : 'Generar Batch'"
            [loading]="generating()"
            [disabled]="generating()" />
        </div>
      </form>
    </div>
  </div>

  <!-- Tabla de batches -->
  <h3 class="form-section-title" style="margin-bottom:0.5rem">Batches</h3>
  <app-data-table
    [data]="batches()"
    [columns]="batchColumns"
    [actions]="batchActions"
    [loading]="loading()">
  </app-data-table>

</div>
