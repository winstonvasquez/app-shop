<div class="page-container">
  <app-page-header
    title="Rutas de Entrega"
    subtitle="Gestión de rutas de despacho y distribución"
    [breadcrumbs]="breadcrumbs">
    <div actions>
      <app-button icon="refresh-cw" variant="ghost" size="sm" label="Actualizar" (click)="loadRoutes()" />
    </div>
  </app-page-header>

  <!-- Mensajes -->
  @if (error()) {
    <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)" />
  }
  @if (successMsg()) {
    <app-alert type="success" [message]="successMsg()!" />
  }

  <app-data-table
    [data]="routes()"
    [columns]="columns"
    [actions]="actions"
    [loading]="loading()"
    [exportable]="true"
    exportFileName="rutas-entrega"
    [exportConfig]="exportConfig"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalElements]="totalElements()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)">
  </app-data-table>
</div>
