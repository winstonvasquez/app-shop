<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Puntos de Reorden</h1>
      <p class="page-subtitle">Alertas de stock mínimo y compras sugeridas</p>
    </div>
    <div class="flex gap-2">
      <app-button [label]="filterSoloAlerta() ? 'Solo alertas' : 'Todos'" icon="filter"
          [variant]="filterSoloAlerta() ? 'danger' : 'secondary'"
          (click)="filterSoloAlerta.set(!filterSoloAlerta()); currentPage.set(0); cargar()" />
      <app-button label="Nuevo" icon="plus" variant="primary" (click)="showForm.set(true)" />
    </div>
  </div>

  <app-data-table
      [data]="items()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      [searchable]="true"
      searchPlaceholder="Buscar por SKU o producto..."
      [filters]="filters"
      [dateRangeFilters]="dateRangeFilters"
      [exportable]="false"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalElements]="totalElements()"
      [totalPages]="totalPages()"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      (searchChange)="onSearchTerm($event)"
      (filterChange)="onFilterChangeEvent($event)"
      (dateRangeChange)="onDateRangeChange($event)"
      (filtersClear)="onFiltersClear()"
      (pageChange)="onPaginationChange($event)"
      (sortChange)="onSort($event)">
  </app-data-table>
</div>

<!-- Drawer nuevo punto de reorden -->
<div class="drawer-overlay" [class.open]="showForm()" (click)="showForm.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showForm()">
  <div class="drawer-header">
    <h2 class="drawer-title">Nuevo Punto de Reorden</h2>
    <button class="modal-close-btn" (click)="showForm.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="mb-4">
        <label class="input-label">SKU *</label>
        <input class="form-input" formControlName="sku" />
      </div>
      <div class="mb-4">
        <label class="input-label">Nombre del Producto *</label>
        <input class="form-input" formControlName="productoNombre" />
      </div>
      <div class="mb-4">
        <label class="input-label">ID Producto *</label>
        <input class="form-input" formControlName="productoId" placeholder="UUID del producto" />
      </div>
      <div class="mb-4">
        <label class="input-label">Proveedor Preferido</label>
        <app-server-search-select [dataSource]="proveedorSource" formControlName="proveedorId" placeholder="Buscar proveedor por nombre o RUC…" />
      </div>
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div>
          <label class="input-label">Stock Mín.</label>
          <input type="number" class="form-input" formControlName="stockMinimo" min="0" />
        </div>
        <div>
          <label class="input-label">Punto Reorden</label>
          <input type="number" class="form-input" formControlName="puntoReorden" min="0" />
        </div>
        <div>
          <label class="input-label">Cant. Sugerida</label>
          <input type="number" class="form-input" formControlName="cantidadSugerida" min="1" />
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <app-button [label]="saving() ? 'Guardando...' : 'Crear'" icon="save" variant="primary" type="submit" [disabled]="form.invalid" [loading]="saving()" class="flex-1" />
        <app-button label="Cancelar" icon="x" variant="secondary" type="button" (click)="showForm.set(false)" />
      </div>
    </form>
  </div>
</div>

<!-- Drawer actualizar stock -->
<div class="drawer-overlay" [class.open]="showStockDrawer()" (click)="showStockDrawer.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showStockDrawer()">
  <div class="drawer-header">
    <h2 class="drawer-title">Actualizar Stock — {{ selectedItem()?.productoNombre }}</h2>
    <button class="modal-close-btn" (click)="showStockDrawer.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="stockForm" (ngSubmit)="guardarStock()">
      <div class="mb-4">
        <label class="input-label">Nuevo Stock Actual *</label>
        <input type="number" class="form-input" formControlName="nuevoStock" min="0" />
      </div>
      <div class="flex gap-3 mt-6">
        <app-button label="Guardar" icon="save" variant="primary" type="submit" [disabled]="stockForm.invalid" class="flex-1" />
        <app-button label="Cancelar" icon="x" variant="secondary" type="button" (click)="showStockDrawer.set(false)" />
      </div>
    </form>
  </div>
</div>

<!-- Drawer editar configuración -->
<div class="drawer-overlay" [class.open]="showConfigDrawer()" (click)="showConfigDrawer.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showConfigDrawer()">
  <div class="drawer-header">
    <h2 class="drawer-title">Editar Configuración — {{ selectedItem()?.productoNombre }}</h2>
    <button class="modal-close-btn" (click)="showConfigDrawer.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="configForm" (ngSubmit)="guardarConfig()">
      <div class="mb-4">
        <label class="input-label">Stock Mínimo *</label>
        <input type="number" class="form-input" formControlName="stockMinimo" min="0" />
      </div>
      <div class="mb-4">
        <label class="input-label">Punto de Reorden *</label>
        <input type="number" class="form-input" formControlName="puntoReorden" min="0" />
      </div>
      <div class="mb-4">
        <label class="input-label">Cantidad Sugerida *</label>
        <input type="number" class="form-input" formControlName="cantidadSugerida" min="1" />
      </div>
      <div class="flex gap-3 mt-6">
        <app-button label="Guardar" icon="save" variant="primary" type="submit" [disabled]="configForm.invalid" class="flex-1" />
        <app-button label="Cancelar" icon="x" variant="secondary" type="button" (click)="showConfigDrawer.set(false)" />
      </div>
    </form>
  </div>
</div>
