<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Control Presupuestario</h1>
      <p class="page-subtitle">Seguimiento de presupuestos de compras por periodo y categoría</p>
    </div>
    <app-button label="Nuevo Presupuesto" icon="plus" variant="primary" (click)="showForm.set(true)" />
  </div>

  <!-- Rango de periodos: controles propios (YYYY-MM), no son fechas reales -->
  <app-data-table
      [data]="presupuestos()"
      [columns]="columns"
      [actions]="actions"
      [loading]="loading()"
      [searchable]="false"
      [filters]="filters"
      [exportable]="false"
      [hidePagination]="true"
      (filterChange)="onFilterChangeEvent($event)"
      (filtersClear)="onFiltersClear()">
      <!-- Filtros propios: el presupuesto se acota por periodos mensuales, no por fechas -->
      <div toolbarExtra>
        <label class="filter-label" for="pre-flt-desde">Periodo desde</label>
        <input id="pre-flt-desde" type="month" class="form-input"
               [value]="filterPeriodoDesde()"
               (change)="onPeriodoDesdeChange($any($event.target).value)" />
      </div>
      <div toolbarExtra>
        <label class="filter-label" for="pre-flt-hasta">Periodo hasta</label>
        <input id="pre-flt-hasta" type="month" class="form-input"
               [value]="filterPeriodoHasta()"
               (change)="onPeriodoHastaChange($any($event.target).value)" />
      </div>
  </app-data-table>
</div>

<!-- Drawer nuevo presupuesto -->
<div class="drawer-overlay" [class.open]="showForm()" (click)="showForm.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showForm()">
  <div class="drawer-header">
    <h2 class="drawer-title">Nuevo Presupuesto</h2>
    <button class="modal-close-btn" (click)="showForm.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="mb-4">
        <label class="input-label">Periodo * <span class="text-muted text-sm">(ej: 2026-04)</span></label>
        <input class="form-input" formControlName="periodo" placeholder="YYYY-MM" />
      </div>
      <div class="mb-4">
        <label class="input-label">Categoría *</label>
        <input class="form-input" formControlName="categoria" placeholder="Ej: MATERIALES, SERVICIOS..." />
      </div>
      <div class="mb-4">
        <label class="input-label">Monto Asignado (S/) *</label>
        <input type="number" class="form-input" formControlName="montoAsignado" min="0" step="0.01" />
      </div>
      <div class="flex gap-3 mt-6">
        <app-button type="submit" label="Crear Presupuesto" icon="wallet" variant="primary" [loading]="saving()" [disabled]="form.invalid" class="flex-1" />
        <app-button type="button" label="Cancelar" icon="x" variant="secondary" (click)="showForm.set(false)" />
      </div>
    </form>
  </div>
</div>

<!-- Drawer editar monto asignado -->
<div class="drawer-overlay" [class.open]="showMontoDrawer()" (click)="showMontoDrawer.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showMontoDrawer()">
  <div class="drawer-header">
    <h2 class="drawer-title">Editar Monto Asignado — {{ selectedPresupuesto()?.periodo }} / {{ selectedPresupuesto()?.categoria }}</h2>
    <button class="modal-close-btn" (click)="showMontoDrawer.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="montoForm" (ngSubmit)="guardarMonto()">
      <div class="mb-4">
        <label class="input-label">Nuevo Monto Asignado (S/) *</label>
        <input type="number" class="form-input" formControlName="nuevoMonto" min="0" step="0.01" />
      </div>
      <div class="flex gap-3 mt-6">
        <app-button label="Guardar" icon="save" variant="primary" type="submit" [disabled]="montoForm.invalid" class="flex-1" />
        <app-button label="Cancelar" icon="x" variant="secondary" type="button" (click)="showMontoDrawer.set(false)" />
      </div>
    </form>
  </div>
</div>
