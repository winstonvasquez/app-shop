<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Historial de Precios</h1>
      <p class="page-subtitle">Evolución de precios por proveedor y producto</p>
    </div>
    <app-button label="Registrar Precio" icon="plus" variant="primary" (click)="showForm.set(true)" />
  </div>

  <app-data-table
      [data]="historial()"
      [columns]="columns"
      [loading]="loading()"
      [searchable]="true"
      searchPlaceholder="Buscar por SKU o producto..."
      [filters]="filters"
      [dateRangeFilters]="dateRangeFilters"
      [exportable]="false"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalElements]="totalElements()"
      [totalPages]="totalPages()"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      (searchChange)="onSearchTerm($event)"
      (filterChange)="onFilterChangeEvent($event)"
      (dateRangeChange)="onDateRangeChange($event)"
      (filtersClear)="onFiltersClear()"
      (pageChange)="onPaginationChange($event)"
      (sortChange)="onSort($event)">
  </app-data-table>
</div>

<!-- Drawer registrar precio -->
<div class="drawer-overlay" [class.open]="showForm()" (click)="showForm.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showForm()">
  <div class="drawer-header">
    <h2 class="drawer-title">Registrar Precio de Referencia</h2>
    <button class="modal-close-btn" (click)="showForm.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="mb-4">
        <label class="input-label">SKU *</label>
        <input class="form-input" formControlName="sku" />
      </div>
      <div class="mb-4">
        <label class="input-label">ID Producto *</label>
        <input class="form-input" formControlName="productoId" placeholder="UUID" />
      </div>
      <div class="mb-4">
        <label class="input-label">Nombre del Producto *</label>
        <input class="form-input" formControlName="productoNombre" />
      </div>
      <div class="mb-4">
        <label class="input-label">Proveedor *</label>
        <app-server-search-select [dataSource]="proveedorSource" formControlName="proveedorId" placeholder="Buscar proveedor por nombre o RUC…" />
      </div>
      <div class="grid grid-cols-2 gap-3 mb-4">
        <div>
          <label class="input-label">Precio Unitario *</label>
          <input type="number" class="form-input" formControlName="precioUnitario" min="0" step="0.01" />
        </div>
        <div>
          <label class="input-label">Moneda</label>
          <app-catalog-select tabla="MONEDA" formControlName="moneda"></app-catalog-select>
        </div>
      </div>
      <div class="mb-4">
        <label class="input-label">Fecha de Referencia</label>
        <input type="date" class="form-input" formControlName="fechaReferencia" />
      </div>
      <div class="flex gap-3 mt-6">
        <app-button [label]="saving() ? 'Guardando...' : 'Registrar'" icon="save" variant="primary" type="submit" [disabled]="form.invalid" [loading]="saving()" class="flex-1" />
        <app-button label="Cancelar" icon="x" variant="secondary" type="button" (click)="showForm.set(false)" />
      </div>
    </form>
  </div>
</div>
