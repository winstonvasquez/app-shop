<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">Evaluación de Proveedores</h1>
      <p class="page-subtitle">Puntúa entrega, calidad, precio y servicio</p>
    </div>
    <app-button label="Nueva Evaluación" variant="primary" icon="plus" (click)="showForm.set(true)" />
  </div>

  <!-- Filtro de periodo: control propio porque no existe endpoint que liste periodos existentes -->
  <div class="filters-bar mb-4">
    <div>
      <label class="input-label">Periodo (YYYY-MM)</label>
      <input type="month" class="form-input w-48"
             [value]="filterPeriodo()"
             (change)="onPeriodoChange($any($event.target).value)" />
    </div>
  </div>

  <app-data-table
      [data]="evaluaciones()"
      [columns]="columns"
      [loading]="loading()"
      [searchable]="true"
      searchPlaceholder="Buscar por observaciones o proveedor..."
      [filters]="filters"
      [dateRangeFilters]="dateRangeFilters"
      [exportable]="false"
      [currentPage]="currentPage()"
      [pageSize]="pageSize()"
      [totalElements]="totalElements()"
      [totalPages]="totalPages()"
      [sortField]="sortField()"
      [sortDirection]="sortDirection()"
      (searchChange)="onSearchTerm($event)"
      (filterChange)="onFilterChangeEvent($event)"
      (dateRangeChange)="onDateRangeChange($event)"
      (filtersClear)="onFiltersClear()"
      (pageChange)="onPaginationChange($event)"
      (sortChange)="onSort($event)">
  </app-data-table>
</div>

<!-- Drawer nueva evaluación -->
<div class="drawer-overlay" [class.open]="showForm()" (click)="showForm.set(false)"></div>
<div class="drawer drawer-right" [class.open]="showForm()">
  <div class="drawer-header">
    <h2 class="drawer-title">Nueva Evaluación</h2>
    <button class="modal-close-btn" (click)="showForm.set(false)">✕</button>
  </div>
  <div class="drawer-body">
    <form [formGroup]="form" (ngSubmit)="guardar()">
      <div class="mb-4">
        <label class="input-label">Proveedor *</label>
        <app-server-search-select [dataSource]="proveedorSource"
                                  formControlName="proveedorId"
                                  placeholder="Buscar proveedor por nombre o RUC…" />
      </div>

      @for (criterio of ['puntajeEntrega', 'puntajeCalidad', 'puntajePrecio', 'puntajeServicio']; track criterio) {
        <div class="mb-4">
          <label class="input-label">
            {{ criterio === 'puntajeEntrega' ? 'Entrega' :
               criterio === 'puntajeCalidad' ? 'Calidad' :
               criterio === 'puntajePrecio' ? 'Precio' : 'Servicio' }} (0–100) *
          </label>
          <input type="number" class="form-input" [formControlName]="criterio" min="0" max="100" />
        </div>
      }

      <div class="mb-4">
        <label class="input-label">Observaciones</label>
        <textarea class="form-input" formControlName="observaciones" rows="3"
                  placeholder="Observaciones adicionales..."></textarea>
      </div>

      <div class="flex gap-3 mt-6">
        <app-button label="Guardar Evaluación" variant="primary" icon="save" type="submit"
                    [loading]="saving()" [disabled]="form.invalid || saving()" class="flex-1" />
        <app-button label="Cancelar" variant="secondary" icon="x" type="button"
                    (click)="showForm.set(false)" />
      </div>
    </form>
  </div>
</div>
