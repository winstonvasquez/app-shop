<div class="page-container">
    <app-page-header
        title="Mis Solicitudes de Compra"
        subtitle="Solicitudes enviadas por ti"
        [breadcrumbs]="breadcrumbs">
    </app-page-header>

    @if (error()) {
        <app-alert type="error" [message]="error()!" [dismissible]="true" (dismiss)="error.set(null)"></app-alert>
    }
    @if (actionError()) {
        <app-alert type="error" [message]="actionError()!" [dismissible]="true" (dismiss)="actionError.set(null)"></app-alert>
    }

    @if (!loading() && !hasSolicitudes() && totalElements() === 0 && !searchQuery() && !filterEstado() && !filterPrioridad()) {
        <div class="text-center py-2xl text-subtle">
            <h3 class="text-lg font-bold text-on mb-xs">No tienes solicitudes de compra</h3>
            <p>Accede a <a routerLink="/compras/solicitudes" class="text-primary">Solicitudes de Compra</a> para crear una nueva.</p>
        </div>
    } @else {
        <app-data-table
            [data]="solicitudes()"
            [columns]="columns"
            [actions]="actions"
            [loading]="loading()"
            [searchable]="true"
            searchPlaceholder="Buscar por código o justificación..."
            [filters]="filters"
            [dateRangeFilters]="dateRangeFilters"
            [exportable]="false"
            [currentPage]="currentPage()"
            [pageSize]="pageSize()"
            [totalElements]="totalElements()"
            [totalPages]="totalPages()"
            (searchChange)="onSearchTerm($event)"
            (filterChange)="onFilterChangeEvent($event)"
            (dateRangeChange)="onDateRangeChange($event)"
            (filtersClear)="onFiltersClear()"
            (pageChange)="onPaginationChange($event)">
        </app-data-table>
    }
</div>
